# Reply Bot

name: Reply-Bot

on:
  discussion:
    types: [created]
  discussion_comment: # testing
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  discussions: write

jobs:
  bot-response:
    runs-on: ubuntu-24.04
    steps:
    - name: Set Variables
      id: vars
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "branch=$(echo ${{ github.ref_name }} | tr / __)" >> $GITHUB_OUTPUT
        echo $GITHUB_OUTPUT

    - name: analyze
      id: analyze
      run: |
        echo "response=Hello_World" >> $GITHUB_OUTPUT
        echo $GITHUB_OUTPUT

    - name: Run discussion-auto-responder
      uses: wesleyscholl/discussion-auto-responder@v1.0.8
      id: autoresponder-comment
      with:
        GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        comment_body: "${{ steps.analyze.outputs.response }}"
        delay_milliseconds: 1000

